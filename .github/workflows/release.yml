name: Release

# Publishing is driven by a tag, not by a branch push. The tag is the record of
# what was released; main keeps moving.
#
#   npm version patch        # bumps package.json, commits, creates the tag
#   git push --follow-tags   # pushing the tag triggers this workflow
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run every check but do not publish"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  # A security tool must not ship on a red build. Everything below has to pass
  # before anything reaches npm.
  verify:
    name: types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # A tag that disagrees with package.json publishes the wrong version and
      # cannot be undone - npm forbids re-publishing a version number.
      - name: Tag must match package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG does not match package.json version $PKG"
            echo "Fix with: npm version $TAG --allow-same-version, or retag."
            exit 1
          fi
          echo "tag v$TAG matches package.json"

  # The "works with npm, Yarn 1-4, pnpm and Bun" claim is re-earned on every
  # release, against real audits rather than recorded fixtures.
  verify-package-managers:
    name: verify ${{ matrix.pm }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pm: [npm, yarn1, yarn4, pnpm, bun]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Enable Corepack
        if: matrix.pm != 'bun'
        run: corepack enable
      - uses: oven-sh/setup-bun@v2
        if: matrix.pm == 'bun'
        with:
          bun-version: latest
      - run: npm ci
      - run: npm run build
      - run: node scripts/verify-package-manager.mjs ${{ matrix.pm }}

  publish:
    name: publish to npm
    runs-on: ubuntu-latest
    needs: [verify, verify-package-managers]
    environment: release
    permissions:
      contents: read
      # Required for npm provenance: the package carries a signed attestation
      # proving it was built from this repository, at this commit.
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build

      # Catch a packaging mistake before it is permanent.
      - name: Show what would be published
        run: npm pack --dry-run

      - name: Publish
        if: github.event_name == 'push' || inputs.dry_run == false
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Dry run only
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: echo "Dry run - everything verified, nothing published."

  github-release:
    name: create GitHub release
    runs-on: ubuntu-latest
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
